name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenWispr
        run: swift build -c release
      - name: Check installer and app bundle
        run: |
          bash -n scripts/install-from-source.sh scripts/bundle-app.sh
          bash scripts/bundle-app.sh .build/release/open-wispr OpenWispr.app 0.11.8
          plutil -lint OpenWispr.app/Contents/Info.plist
